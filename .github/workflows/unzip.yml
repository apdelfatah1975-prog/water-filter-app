name: Auto Unzip
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Unzip files
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Found zip file, unzipping..."
            unzip *.zip
            rm *.zip
            git config --global user.name "GitHub Action"
            git config --global user.email "action@github.com"
            git add .
            git commit -m "Auto-unzip project files"
            git push
          else
            echo "No zip file found, skipping."
          fi
          
